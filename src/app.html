<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מתארגנים לחתונה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap">
<style>
:root{
  --canvas:#F7F7F5; --panel:#FFFFFF; --tile:#F4F4F1; --ink:#1B1B19; --muted:#686760; --line:#E3E1DA;
  --yellow:#AEDCF2; --yellow-ink:#1B1B19; --danger:#9B2C2C; --ok:#5B7F5E;
  --r-panel:24px; --r-tile:18px; --r-ctl:12px;
  --shadow:0 1px 2px rgba(27,27,25,.04),0 6px 20px rgba(27,27,25,.05);
  --shadow-sm:0 1px 2px rgba(27,27,25,.05),0 2px 8px rgba(27,27,25,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.btn,.chip,.navitem,.seg button,.mv button,.del,.linkbtn,.tabbar button,.bulk button{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease,border-color .2s ease}
.btn:hover:not(:disabled){box-shadow:0 2px 10px rgba(27,27,25,.18)}
.chip:hover,.mv button:hover,.bulk button:hover{border-color:#C9C7C0}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{display:flex;gap:16px;padding:16px;max-width:1440px;margin:0 auto;align-items:flex-start}
/* sidebar */
.side{position:sticky;top:16px;flex:0 0 240px;background:var(--panel);border-radius:var(--r-panel);box-shadow:var(--shadow);padding:18px 14px;display:flex;flex-direction:column;gap:6px;min-height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand .mark{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--yellow);display:flex;align-items:center;justify-content:center;flex:none}
.brand b{font-family:'Heebo',sans-serif;font-weight:700;font-size:17px;line-height:1.2}
.navitem{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border-radius:14px;border:none;background:transparent;text-align:right;width:100%;font-weight:600;color:var(--ink)}
.navitem svg{width:20px;height:20px;flex:none}
.navitem .cnt{margin-inline-start:auto;font-size:13px;color:var(--muted);font-weight:600}
.navitem:hover{background:var(--tile)}
.navitem[aria-current="page"]{background:var(--ink);color:#fff}
.navitem[aria-current="page"] .cnt{color:#cfcfc8}
.side .grow{flex:1}
.mebox{background:var(--tile);border-radius:var(--r-tile);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mebox label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mebox select,.mebox input{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;padding:0 10px}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding:6px 6px 0}
.top h1{margin:0;font-size:34px;font-weight:400;letter-spacing:-.01em}
body.vhome .top h1{font-size:24px;font-weight:500}
.top .dates{margin:4px 0 0;color:var(--muted);font-size:15px}
.top .dates .heb{font-family:'Heebo',sans-serif;font-weight:700;color:var(--ink);font-size:18px}
.panel{background:var(--panel);border-radius:var(--r-panel);padding:18px;box-shadow:var(--shadow)}
.panel h2{margin:0;font-size:20px;font-weight:700}
.panel .phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel .psub{margin:2px 0 0;color:var(--muted);font-size:14px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);box-shadow:var(--shadow);border-radius:var(--r-tile);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{font-size:40px;font-weight:300;line-height:1;letter-spacing:-.02em}
.kpi small{font-size:13px;color:var(--muted)}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi.hl{background:var(--yellow)}
.kpi.hl span,.kpi.hl small{color:#45431f}
.kpi .row2{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px}
.kpi b.long{font-size:28px}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stage{background:var(--tile);border-radius:var(--r-tile);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;background:#fff;box-shadow:var(--shadow-sm);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:#8E8C84;display:inline-block}
.pill.y{background:var(--yellow)}
.pill.k{background:var(--ink);color:#fff}
.hatch{flex:1;border:1px solid #BDBAB2;border-radius:12px;background:repeating-linear-gradient(-45deg,#CFCCC4 0 1px,transparent 1px 8px);align-self:stretch;margin-top:auto}
.hatch.full{background:var(--yellow);border-color:var(--yellow)}
.hwrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:60px}
.stage .num{display:flex;align-items:baseline;gap:6px}
.stage .num b{font-size:36px;font-weight:300;line-height:1}
.stage .num span{color:var(--muted);font-size:14px}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.li:first-of-type{border-top:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:13px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;background:var(--tile);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.av.me{background:var(--yellow)}
.empty{color:var(--muted);font-size:14px;padding:10px 4px;margin:0}
.notice{background:var(--yellow);border-radius:var(--r-tile);padding:12px 16px;font-size:15px}
.notice[hidden]{display:none}

/* controls */
.in{border:1px solid var(--line);background:#fff;border-radius:var(--r-ctl);min-height:42px;padding:0 10px;min-width:0}
.in.flat{border-color:transparent;background:transparent}
.in.flat:hover{border-color:var(--line)}
.in:focus{outline:none;border-color:var(--ink)}
select.in{padding:0 8px}
.num{width:110px;text-align:left;direction:ltr}
.small{width:64px;text-align:center;direction:ltr}
.btn{min-height:42px;padding:0 18px;border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;white-space:nowrap}
.btn.light{background:var(--tile);color:var(--ink)}
.btn.y{background:var(--yellow);color:var(--yellow-ink)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;background:var(--tile);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
#evSeg .seg{background:#fff;box-shadow:var(--shadow-sm)}
#evSeg .seg button{min-height:32px;font-size:14px;padding:0 12px}
.seg button{border:none;background:transparent;border-radius:999px;min-height:36px;padding:0 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow)}
.del{min-width:40px;min-height:40px;border:none;background:transparent;color:var(--muted);border-radius:10px;font-size:13px;padding:0 8px}
.del:hover{background:var(--tile)}
.del.warn{background:var(--danger);color:#fff}
.addbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--tile);border-radius:var(--r-tile);padding:10px}
.addbar .grow{flex:1 1 200px}

/* tasks */
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 4px;border-top:1px solid var(--line)}
.trow.done .ttl{text-decoration:line-through;color:var(--muted)}
.ttl{flex:1 1 220px;font-weight:600}
.due{font-size:13px;color:var(--muted);min-width:74px}
.due.late{color:var(--danger);font-weight:700}
.check{width:24px;height:24px;accent-color:var(--ink);flex:none}
.gh{font-size:14px;font-weight:700;color:var(--muted);margin:16px 4px 4px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--tile);border-radius:var(--r-tile);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.colh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.tcard{background:#fff;box-shadow:var(--shadow-sm);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.mv{display:flex;gap:6px}
.mv button{min-height:34px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 10px;font-size:13px;font-weight:600}

/* vendors */
.vcard{background:#fff;box-shadow:var(--shadow-sm);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent}
.vcard.open{border-color:var(--ink)}
.vcard .vh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.vcard .vh b{font-weight:700;font-size:16px}
.vcard .price{font-size:22px;font-weight:400}
.prog{height:6px;border-radius:3px;background:var(--tile);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:3px}
.vfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vfields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.vfields .in{width:100%;min-width:0;max-width:100%}
.vcard,.tcard,.col{min-width:0}
.grip{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;color:#9A9890;cursor:grab;touch-action:none;border-radius:8px;flex:none}
.grip:hover{background:var(--tile);color:var(--ink)}
.dnd{cursor:grab}
.dragging{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 14px 34px rgba(27,27,25,.18) !important;transform:rotate(1.5deg);margin:0}
body.nosel{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drop].over{background:#EAF6FC;outline:2px dashed #BDB65A;outline-offset:-2px}
.dzone{border:1.5px dashed var(--line);border-radius:12px;padding:10px;color:var(--muted);font-size:13px;text-align:center;margin:4px 0}
.grp{border-radius:14px;padding:0 4px 4px}
.vfields .full{grid-column:1/-1}
.linkbtn{border:none;background:none;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;min-height:30px;text-align:right}
.tel{direction:ltr;unicode-bidi:isolate;font-size:14px;white-space:nowrap}

/* budget */
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fam{background:var(--tile);border-radius:var(--r-tile);padding:14px 16px}
.fam h3{margin:0 0 8px;font-size:16px}
.fam dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.fam dt{color:var(--muted)} .fam dd{margin:0;font-weight:600;direction:ltr;text-align:left}
.balance{margin-top:12px;background:var(--yellow);border-radius:var(--r-tile);padding:12px 16px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:left;direction:ltr;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -6px}
.cbar{position:relative;height:10px;background:var(--tile);border-radius:5px;min-width:90px;overflow:hidden}
.cbar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ink);border-radius:5px}
.cbar i.over{background:var(--danger)}
.cbar em{position:absolute;inset-block:0;width:2px;background:#8E8C84}

/* guests */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px}
.gtable td .in{min-height:38px}
.gtable input[type=tel]{width:120px;direction:ltr}
.gtable select.in{max-width:120px}
.gtable .gname{width:100%;font-weight:600}
.gtable select.mini{min-height:30px;font-size:13px;color:var(--muted);padding:0 4px}
.gtable td{padding:6px 4px}
.gtable tr.sel td{background:#EAF6FC}
.bulk{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;box-shadow:0 8px 30px rgba(27,27,25,.18);padding:6px 8px;display:flex;gap:6px;align-items:center;z-index:30;max-width:calc(100vw - 24px);overflow-x:auto}
.bulk[hidden]{display:none}
.bulk b{padding:0 10px;white-space:nowrap}
.bulk button{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;font-weight:600;white-space:nowrap}
.sendbtn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;min-width:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.sendbtn.wa{background:#E6F4EA;border-color:#CBE6D2}
.sendbtn:hover{border-color:#C9C7C0}
.rsvpnote{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--yellow);border-radius:var(--r-tile);padding:12px 14px;margin-bottom:12px}
.qbar b{flex:1 1 180px}
.hero2{background:var(--yellow);border-radius:var(--r-panel);padding:22px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hcount{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hcount b{font-size:84px;font-weight:300;line-height:.9;letter-spacing:-.03em}
.hlabel{font-size:20px;font-weight:500}
.hdate{display:flex;flex-direction:column;align-items:flex-end;text-align:left}
.hdate b{font-size:20px;font-weight:600}.hdate span{font-size:14px;color:#1F4A60}
.pcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pcards.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pcard{background:var(--panel);box-shadow:var(--shadow);border:none;border-radius:var(--r-tile);padding:14px 16px;text-align:right;display:flex;flex-direction:column;gap:6px;font:inherit;color:var(--ink);cursor:pointer;transition:box-shadow .2s}
.pcard:hover{box-shadow:0 2px 6px rgba(27,27,25,.06),0 10px 26px rgba(27,27,25,.08)}
.pcard .pl{font-size:14px;color:var(--muted);font-weight:500}
.pbig{display:flex;align-items:baseline;gap:6px}.pbig b{font-size:30px;font-weight:400;line-height:1.1}.pbig span{font-size:14px;color:var(--muted)}
.pcard small{font-size:13px;color:var(--muted)}
.hmain{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.hside{display:flex;flex-direction:column;gap:16px}
.addexp{border:2px solid var(--ink)}
.addexp h2{font-size:18px}
.paidchk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);min-height:42px;padding:0 4px}
.pcard.static{cursor:default}.pcard.static:hover{box-shadow:var(--shadow)}
.prog i.over{background:var(--danger)}
.xtable td b{font-weight:600}.xtable td.n b{font-weight:500}
.actc2{text-align:left;white-space:nowrap}
.balbar{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;align-items:center;padding:14px 18px}
.bfam{display:flex;flex-direction:column}.bfam span{font-size:13px;color:var(--muted)}.bfam b{font-size:22px;font-weight:400}
.bres{background:var(--yellow);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column}.bres b{font-weight:600}.bres span{font-size:13px;color:#1F4A60}
select.whopaid{font-size:14px;color:var(--ink)}
.openlink{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border:1.5px solid var(--ink)}
.openlink h2{margin:0 0 4px}.openlink p{margin:0 0 8px;color:var(--muted);font-size:14px;max-width:560px}
.olurl{direction:ltr;display:inline-block;font-size:15px;color:var(--ink);word-break:break-all}
.olbtns{display:flex;gap:8px;flex-wrap:wrap}.olbtns a.btn{text-decoration:none;display:inline-flex;align-items:center}
.evtag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.evtag.ev0{background:#e3ebfa;color:#2f4a80}.evtag.ev1{background:#f6e7d6;color:#7a4a1c}.evtag.ev2{background:#e2f0e2;color:#2f5f33}.evtag.ev3{background:#efe6f7;color:#5a3a7a}
.xname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select.evpick.need{border-color:#d0475f;box-shadow:0 0 0 3px #f6d5dc}
.editbox{display:flex;gap:6px;flex-wrap:wrap}.editbox .in{min-width:0;flex:1 1 140px}
.xtable tr.editing{box-shadow:0 0 0 2px var(--ink),0 2px 10px rgba(30,30,20,.08)}
.btn.sm{padding:6px 14px;font-size:14px}
.actc2 > *{margin-inline-start:8px}
.restbox{padding:12px;background:#fbe3ea;border-radius:12px;font-size:14px;color:#6d2a40;display:flex;flex-direction:column;gap:10px}.restbox .fld{color:#6d2a40}.restrow{justify-content:space-between}
.paidtxt{font-size:15px}.paidtxt.zero{color:var(--muted)}.p2note{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.editform{display:flex;flex-direction:column;gap:12px;padding:4px 2px}
.efrow{display:flex;gap:12px;flex-wrap:wrap}.efrow .fld{flex:1 1 180px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.fld .in{width:100%}
.efact{display:flex;align-items:center;gap:10px}
.restrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.restrow .chip{background:#fff}
table.gtable2.xtable{border-collapse:separate !important;border-spacing:0 10px}
.xtable thead th{border-bottom:none !important}
.xtable tbody tr{background:#fff;box-shadow:0 2px 10px rgba(30,30,20,.08);border-radius:14px}
.xtable tbody td{border-bottom:none !important;background:#fff}
.xtable tbody td:first-child{border-radius:0 14px 14px 0;padding-right:16px}.xtable tbody td:last-child{border-radius:14px 0 0 14px;padding-left:16px}
select.stsel{font-size:14px;border-radius:999px;padding:5px 12px;border:0;font-weight:500}
.xtable select.stsel{width:auto;background-color:#eeeeec;color:#555}.xtable select.st-part{background-color:#fbe3ea;color:#8a3550}.xtable select.st-paid{background-color:var(--yellow);color:#163C50}
@media (max-width:860px){.balbar{grid-template-columns:1fr 1fr}.bres{grid-column:1 / -1}}
.actc2 .sendbtn{margin-inline-end:4px}
@media (max-width:860px){
  .xtable thead{display:none}.xtable,.xtable tbody{display:block}
  .xtable tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:14px 16px;border-bottom:none;margin-bottom:12px}
  .xtable tbody td:first-child,.xtable tbody td:last-child{border-radius:0;padding:0 !important}
  .xtable td{display:block;padding:0;border:none !important;background:none}
  .xtable td:nth-child(3)::before{content:'שולם: ';font-size:13px;color:var(--muted)}
  .xtable td:nth-child(3){display:flex;align-items:center;gap:4px}
  .ghead{flex-wrap:wrap}
  .xtable td{height:auto !important;min-height:0 !important;align-self:center;padding:0 !important}
  .xtable td:nth-child(1){grid-column:1;grid-row:1}.xtable td:nth-child(2){grid-column:2;grid-row:1}
  .xtable td:nth-child(3){grid-column:1;grid-row:2}.xtable td:nth-child(5){grid-column:2;grid-row:2}
  .xtable td:nth-child(4){grid-column:1;grid-row:3}

    var nk=famKey(f), ta=el('textarea',{class:'in','aria-label':'פתקים של '+f,rows:'6',style:'width:100%;padding:10px;min-height:140px;resize:vertical;font:inherit',disabled:!S.canWrite,placeholder:'רעיונות, טלפונים חשובים, דברים לזכור…'});
    ta.value=(S.notes[nk]&&S.notes[nk].text)||'';
    ta.addEventListener('change',function(){if(guard())db.doc('notes/'+nk).set({text:ta.value,by:S.me||'',at:Date.now()}).catch(onErr);});
    v.appendChild(el('div',{class:'grid3',style:'grid-template-columns:repeat(2,minmax(0,1fr))'},[
      panel('משימות של '+f,'לא מופיעות ברשימת המשימות המשותפת',null,tk),
      panel('רשימת הכנות וקניות',null,null,pk),
      panel('הוצאות של '+f,'מה שרק המשפחה הזו משלמת',null,ek),
      panel('פתקים',S.notes[nk]&&S.notes[nk].by?'עודכן לאחרונה על ידי '+S.notes[nk].by:null,null,[ta])
    ]));
  }

  /* ---------- drag & drop ---------- */
  var drag=null, GRIP='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
  function grip(label){var g=el('span',{class:'grip',title:'גררו כדי להעביר','aria-label':label||'גרירה'});g.innerHTML=GRIP;return g;}
  var DROP={
    ts:function(t,v){if(tstat(t)!==v)setStatus(t,v);},
    tw:function(t,v){if((t.when||'מיד')!==v){upd('tasks',t.id,{when:v,due:''});act(S.me+' '+verb(S.me,'העביר','העבירה')+' את "'+(t.title||'')+'" ל"'+v+'"');}},
    vs:function(x,v){if((x.status||'בבדיקה')!==v){upd('vendors',x.id,{status:v});act(S.me+' '+verb(S.me,'העביר','העבירה')+' את '+(x.name||'הספק')+' ל"'+v+'"');}}
  };
  function dnd(card,kind,item){
    if(!S.canWrite)return card;
    card.classList.add('dnd');
    card.addEventListener('pointerdown',function(e){
      if(e.button>0)return;
      if(e.target.closest('input,select,textarea,button,a,label'))return;
      if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;
      drag={kind:kind,item:item,card:card,x:e.clientX,y:e.clientY,started:false,zone:null};
    });
    return card;
  }
  function zoneAt(x,y){var e=document.elementFromPoint(x,y);return e&&e.closest('[data-drop]');}
  document.addEventListener('pointermove',function(e){
    if(!drag)return;
    if(!drag.started){
      if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<6)return;
      var r=drag.card.getBoundingClientRect();
      drag.started=true;drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
      var g=drag.card.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';document.body.appendChild(g);drag.ghost=g;
      drag.card.classList.add('dragging');document.body.classList.add('nosel');
    }
    e.preventDefault();
    drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
    var z=zoneAt(e.clientX,e.clientY);
    if(z&&z.dataset.drop.split(':')[0]!==drag.kind)z=null;
    if(z!==drag.zone){if(drag.zone)drag.zone.classList.remove('over');if(z)z.classList.add('over');drag.zone=z;}
    if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-90)window.scrollBy(0,14);
  },{passive:false});
  function endDrag(cancel){
    if(!drag)return;var d=drag;drag=null;
    if(d.started){
      if(d.ghost)d.ghost.remove();d.card.classList.remove('dragging');document.body.classList.remove('nosel');
      if(d.zone){d.zone.classList.remove('over');if(!cancel){var parts=d.zone.dataset.drop.split(':');DROP[d.kind](d.item,parts.slice(1).join(':'));}}
      var stop=function(ev){ev.stopPropagation();ev.preventDefault();window.removeEventListener('click',stop,true);};
      window.addEventListener('click',stop,true);setTimeout(function(){window.removeEventListener('click',stop,true);},50);
      if(S.pending)render();
    }
  }
  document.addEventListener('pointerup',function(){endDrag(false);});
  document.addEventListener('pointercancel',function(){endDrag(true);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')endDrag(true);});

  /* ---------- shell ---------- */
  var VIEWS=[['home','בית'],['tasks','משימות'],['budget','הוצאות'],['guests','מוזמנים'],['family','המשפחה'],['settings','הגדרות']];
  function counts(){return {tasks:S.tasks.filter(inEv).filter(function(t){return !t.family&&tstat(t)!=='בוצע';}).length,vendors:S.vendors.filter(inEv).length,guests:heads(S.guests.filter(inEvG))};}
  function renderNav(){
    var c=counts();
    [$('sideNav'),$('tabbar')].forEach(function(nav,i){nav.innerHTML='';VIEWS.forEach(function(vw){if(i===1&&vw[0]==='settings')return;
      var b=el('button',{class:i===0?'navitem':'',type:'button','aria-current':S.view===vw[0]?'page':false,onclick:function(){go(vw[0]);}},[svg(vw[0]),el('span',{text:vw[1]}),i===0&&c[vw[0]]?el('span',{class:'cnt',text:String(c[vw[0]])}):null]);
      nav.appendChild(b);});});
  }
  function go(v){S.view=v;S.openVendor=null;try{sessionStorage.setItem('wview',v);}catch(e){}render();window.scrollTo(0,0);}
  function renderHeader(){
    var h=new Date().getHours(),g=h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב';
    var vt=VIEWS.filter(function(x){return x[0]===S.view;})[0];
    $('greet').textContent=S.view==='home'?g+(S.me?', '+S.me:''):(vt?vt[1]:'');
    $('dates').hidden=true;
    document.body.classList.toggle('vhome',S.view==='home');
    var ek=S.ev==='הכול'?'חתונה':S.ev,eds=evDate(ek),w=eds?new Date(eds+'T00:00:00'):null,dt=$('dates');dt.innerHTML='';
    var es=$('evSeg');es.innerHTML='';es.hidden=S.view==='settings'||S.view==='guests';if(S.ev==='דירה'&&S.view!=='budget')S.ev='הכול';es.appendChild(seg([['הכול','הכול']].concat((S.view==='budget'?XEVENTS:EVENTS).map(function(e){return [e,e];})),S.ev,function(e){S.ev=e;S.sel={};S.openVendor=null;try{sessionStorage.setItem('wev',e);}catch(x){}render();},'אירוע'));
    if(w){var dl=evDays(eds);if(S.ev!=='הכול'&&S.ev!=='חתונה')dt.appendChild(el('span',{text:S.ev+': '}));dt.appendChild(el('span',{class:'heb',text:hebrewDate(w)}));dt.appendChild(document.createTextNode('  '+w.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(dl>0?', עוד '+dl+' ימים':dl===0?', היום!':'')));}
    else dt.textContent=(S.ev==='הכול'||S.ev==='חתונה')?'בוחרים תאריך חתונה בהגדרות':'עוד לא נקבע תאריך ל'+S.ev+'. בוחרים בהגדרות';
    var ed=S.settings.evDates||{},dv=$('dVort'),dsh=$('dSheva');
    if(document.activeElement!==dv)dv.value=ed['ווארט']||'';if(document.activeElement!==dsh)dsh.value=ed['שבת שבע ברכות']||'';dv.disabled=dsh.disabled=!S.canWrite;
    $('brandTitle').textContent=S.settings.title||'החתונה שלנו';
    var t=$('titleIn'),d=$('dateIn');if(document.activeElement!==t)t.value=S.settings.title||'';if(document.activeElement!==d)d.value=S.settings.date||'';
    t.disabled=d.disabled=!S.canWrite;
    [$('meSel'),$('meSelM')].forEach(function(s){if(!s.options.length)PEOPLE.forEach(function(p){s.appendChild(el('option',{value:p,text:p}));});s.value=S.me||'רבקה';});
  }
  function render(){
    var v=$('view'),ae=document.activeElement;
    if(drag&&drag.started){S.pending=true;return;}
    var keep=null;
    if(v.contains(ae)&&ae.tagName==='SELECT'){S.pending=true;return;}
    // keep everything typed or chosen in the add forms while the page refreshes
    var draft=[].map.call(v.querySelectorAll('.addbar [aria-label]'),function(f){return {label:f.getAttribute('aria-label'),val:f.value,hidden:f.hidden,tag:f.tagName};});
    if(v.contains(ae)&&ae.closest&&ae.closest('.addbar')&&ae.getAttribute('aria-label')){keep={label:ae.getAttribute('aria-label'),val:ae.value};}
    else if(v.contains(ae)&&ae.tagName==='INPUT'&&ae.type!=='checkbox'&&ae.type!=='search'){S.pending=true;return;}
    if(v.contains(ae)&&ae.type==='search'){S.pending=false;renderNav();renderHeader();var box=ae.closest('.panel').lastChild;renderGuestTable(box);return;}
    S.pending=false;renderNav();renderHeader();v.innerHTML='';
    if(!db){v.appendChild(el('section',{class:'panel'},[el('p',{class:'empty',text:'טוען את הנתונים…'})]));updBulk();return;}
    ({home:renderHome,tasks:renderTasks,vendors:renderVendors,budget:renderBudget,guests:renderGuests,family:renderFamily,settings:renderSettings})[S.view](v);
    if(draft.length&&S.draftView===S.view+'|'+S.ev){var fs=v.querySelectorAll('.addbar [aria-label]');[].forEach.call(fs,function(f){var d=draft.filter(function(x){return x.label===f.getAttribute('aria-label')&&x.tag===f.tagName;})[0];if(!d)return;f.value=d.val;if(f.tagName!=='BUTTON')f.hidden=d.hidden;});}
    S.draftView=S.view+'|'+S.ev;
    if(keep){var ks=v.querySelectorAll('.addbar [aria-label]');for(var ki=0;ki<ks.length;ki++){if(ks[ki].getAttribute('aria-label')===keep.label){if(ks[ki].tagName==='INPUT')ks[ki].value=keep.val;ks[ki].focus();break;}}}
    updBulk();
  }
  document.addEventListener('focusout',function(){setTimeout(function(){if(S.pending)render();},0);});
  $('titleIn').addEventListener('change',function(){saveSettings({title:$('titleIn').value.trim()});});
  $('dateIn').addEventListener('change',function(){saveSettings({date:$('dateIn').value});act(S.me+' '+verb(S.me,'עדכן','עדכנה')+' את תאריך החתונה');});
  function setEvDate(ev,val){var ed=Object.assign({},S.settings.evDates||{});ed[ev]=val;saveSettings({evDates:ed});}
  $('dVort').addEventListener('change',function(){setEvDate('ווארט',$('dVort').value);});
  $('dSheva').addEventListener('change',function(){setEvDate('שבת שבע ברכות',$('dSheva').value);});
  (function(){var g=$('gearM');g.appendChild(svg('settings'));g.addEventListener('click',function(){go('settings');});})();
  function setMe(p){S.me=p;store('me',p);$('who').hidden=true;render();}
  [$('meSel'),$('meSelM')].forEach(function(s){s.addEventListener('change',function(){setMe(s.value);});});
  PEOPLE.forEach(function(p){$('whoOpts').appendChild(el('button',{type:'button',text:p,onclick:function(){setMe(p);}}));});
  S.me=store('me');if(PEOPLE.indexOf(S.me)<0){S.me=null;if(!(!(window.claude&&window.claude.use)&&/^https?:/.test(location.protocol)))$('who').hidden=false;}
  try{var sv=sessionStorage.getItem('wview');if(sv&&sv!=='vendors')S.view=sv;var se=sessionStorage.getItem('wev');if(se)S.ev=se;}catch(e){}

  /* ---------- connect ---------- */
  render();
  var timer=setTimeout(function(){notice('הנתונים עוד לא נטענו. בדקו שיש חיבור לאינטרנט ושאתם מחוברים לחשבון Claude.');},10000);
  function ok(meta){if(meta&&!meta.fromCache){clearTimeout(timer);if($('notice').textContent.indexOf('עוד לא נטענו')>=0)notice('');}}
  function restDb(key){
    var cache={},subs={},dsubs={},since=0,loaded=false,timer=null;
    function snapCol(col){var c=cache[col]||{};var docs=Object.keys(c).map(function(id){var d=c[id];return {id:id,exists:true,data:function(){return d;},metadata:{fromCache:false,hasPendingWrites:false}};});
      return {docs:docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:function(){return [];}};}
    function emit(col){(subs[col]||[]).forEach(function(f){f(snapCol(col));});
      Object.keys(dsubs).forEach(function(k){if(k.indexOf(col+'/')!==0)return;var id=k.slice(col.length+1),d=(cache[col]||{})[id];
        dsubs[k].forEach(function(f){f({id:id,exists:!!d,data:function(){return d;},metadata:{fromCache:false,hasPendingWrites:false}});});});}
    function api(method,path,body){return fetch('/api'+path,{method:method,headers:{'content-type':'application/json','x-family-key':key},body:body?JSON.stringify(body):undefined})
      .then(function(r){if(r.status===401){var e={code:'revoked',message:'auth'};throw e;}if(!r.ok){throw {code:r.status===400?'invalid_argument':'unavailable'};}return r.json();});}
    function poll(){
      api('GET','/db?since='+since).then(function(j){var ch={};
        (j.docs||[]).forEach(function(d){cache[d.col]=cache[d.col]||{};if(d.deleted)delete cache[d.col][d.id];else cache[d.col][d.id]=d.data;ch[d.col]=1;if(d.updated_at>since)since=d.updated_at;});
        if(!loaded){loaded=true;Object.keys(subs).concat(Object.keys(dsubs).map(function(k){return k.split('/')[0];})).forEach(function(c){ch[c]=1;});}
        Object.keys(ch).forEach(emit);
      }).catch(function(e){if(e&&e.code==='revoked'){try{localStorage.removeItem('wed_key');}catch(x){}location.reload();}})
      .then(function(){clearTimeout(timer);timer=setTimeout(poll,document.hidden?15000:3000);});
    }
    document.addEventListener('visibilitychange',function(){if(!document.hidden){clearTimeout(timer);poll();}});
    function docRef(col,id){return {id:id,path:col+'/'+id,
      get:function(){var d=(cache[col]||{})[id];return Promise.resolve({id:id,exists:!!d,data:function(){return d;},metadata:{fromCache:false}});},
      set:function(data){cache[col]=cache[col]||{};cache[col][id]=JSON.parse(JSON.stringify(data));emit(col);return api('PUT','/db/'+col+'/'+id,{data:data,merge:false}).then(function(){});},
      update:function(data){cache[col]=cache[col]||{};cache[col][id]=Object.assign({},cache[col][id]||{},JSON.parse(JSON.stringify(data)));emit(col);return api('PUT','/db/'+col+'/'+id,{data:data,merge:true}).then(function(){});},
      delete:function(){if(cache[col])delete cache[col][id];emit(col);return api('DELETE','/db/'+col+'/'+id).then(function(){});},
      onSnapshot:function(next){var k=col+'/'+id;(dsubs[k]=dsubs[k]||[]).push(next);if(loaded){var d=(cache[col]||{})[id];next({id:id,exists:!!d,data:function(){return d;},metadata:{fromCache:false}});}return function(){};}
    };}
    poll();
    return {doc:function(path){var a=path.split('/');return docRef(a[0],a[1]);},
      collection:function(col){return {doc:function(id){return docRef(col,id||rid());},
        add:function(data){var r=docRef(col,rid());return r.set(data).then(function(){return r;});},
        onSnapshot:function(next){(subs[col]=subs[col]||[]).push(next);if(loaded)next(snapCol(col));return function(){};}};}};
  }
  var cl=window.claude;
  if(!cl||!cl.use){
    if(!WEB){notice('הדף צריך להיפתח דרך הקישור של האתר כדי לשמור נתונים.');return;}
    var startWeb=function(key){
      fetch('/api/db?since=9999999999999',{headers:{'x-family-key':key}}).then(function(r){
        if(r.status===401){$('login').hidden=false;$('famErr').textContent=key?'הסיסמה לא נכונה':'';return;}
        try{localStorage.setItem('wed_key',key);}catch(e){}
        $('login').hidden=true;if(!S.me)$('who').hidden=false;S.famKey=key;
        cl={use:function(n){return Promise.resolve(n==='db'?restDb(key):null);}};
        connect();
      }).catch(function(){notice('אין חיבור לאתר. בדקו את האינטרנט ונסו שוב.');});
    };
    $('famGo').addEventListener('click',function(){startWeb($('famKey').value.trim());});
    $('famKey').addEventListener('keydown',function(e){if(e.key==='Enter')$('famGo').click();});
    clearTimeout(timer);
    var saved=null;try{saved=localStorage.getItem('wed_key');}catch(e){}
    if(saved)startWeb(saved);else $('login').hidden=false;
    return;
  }
  connect();
  function connect(){
  Promise.all([cl.use('db'),cl.use('user')]).then(function(r){
    db=r[0];var user=r[1];
    if(!db){clearTimeout(timer);notice('כדי לראות ולעדכן את הדף צריך להיות מחוברים לחשבון Claude.');render();return;}
    if(user&&user.can)Promise.resolve(user.can('data.write')).then(function(w){if(w===false){S.canWrite=false;notice('יש לך הרשאת צפייה בלבד.');render();}}).catch(function(){});
    db.doc('planner/invite').onSnapshot(function(s){S.invite=s.exists?s.data():null;render();},function(){});
    if(WEB&&S.famKey)fetch('/api/wa/status',{headers:{'x-family-key':S.famKey}}).then(function(r){return r.json();}).then(function(j){S.waAuto=!!j.configured;render();}).catch(function(){});
    db.collection('notes').onSnapshot(function(s){var o={};s.docs.forEach(function(d){o[d.id]=d.data();});S.notes=o;render();},function(){});
    ['tasks','vendors','expenses','payments','guests','activity','prep'].forEach(function(col){
      db.collection(col).onSnapshot(function(snap){S[col]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});ok(snap.metadata);render();},
        function(){clearTimeout(timer);notice('החיבור לנתונים נקטע. רעננו את הדף.');});
    });
    db.doc('planner/settings').onSnapshot(function(s){S.settings=s.exists?Object.assign({},s.data()):{};ok(s.metadata);render();},function(){});
    render();
  });
  }
})();
