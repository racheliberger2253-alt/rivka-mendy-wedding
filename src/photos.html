<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="צילמתם? נשמח שתשתפו אותנו בתמונות ובסרטונים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
:root{--ink:#191917;--soft:#6E6C66;--line:#E7E5DF;--paper:#FFFFFF;--bg:#F5F4F1;--tile:#F7F6F3;--accent:#EDE48A;--err:#9B2C2C}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:max(16px,env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:0 14px}
.paper{background:var(--paper);border-radius:28px;box-shadow:0 1px 2px rgba(25,25,23,.04),0 10px 30px rgba(25,25,23,.06);padding:30px 22px}
.paper+.paper{margin-top:12px}
.kick{font-size:13px;letter-spacing:.08em;color:var(--soft);text-align:center;margin:0}
h1{font-size:32px;font-weight:300;letter-spacing:-.01em;text-align:center;margin:6px 0 8px;line-height:1.15;text-wrap:balance}
.lead{text-align:center;color:var(--soft);margin:0 auto;max-width:34ch;font-size:16px}
.counter{display:flex;justify-content:center;margin-top:18px}
.counter span{background:var(--tile);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--soft)}
.counter b{color:var(--ink);font-weight:600}
label.f{display:block;margin:0 0 6px;font-size:15px;font-weight:500}
label.f small{color:var(--soft);font-weight:400}
.who{margin-top:18px}
.who input{margin:0}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,button:focus-visible,.pick:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:1.5px dashed #CFCCC3;
  border-radius:22px;background:var(--tile);cursor:pointer;text-align:center;padding:18px;transition:background-color .2s,border-color .2s}
.pick:hover{border-color:var(--ink)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pick .ic{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.pick b{font-size:17px;font-weight:600}
.pick span{font-size:14px;color:var(--soft)}
.pick.drag{background:#EFEDE6;border-color:var(--ink)}
.files{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.tile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--tile)}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .vid{position:absolute;top:6px;left:6px;background:rgba(25,25,23,.6);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px}
.tile .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.6)}
.tile .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.tile.ok::after{content:'✓';position:absolute;inset:auto auto 8px 8px;width:24px;height:24px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.tile.fail{outline:2px solid var(--err);outline-offset:-2px}
.tile .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:16px;line-height:1;cursor:pointer}
.sum{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin-top:10px}
.send{width:100%;min-height:56px;margin-top:12px;border:none;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:opacity .2s}
.send:disabled{opacity:.25;cursor:default}
.prog{margin-top:14px}
.prog .track{height:8px;border-radius:999px;background:var(--tile);overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.prog p{margin:8px 0 0;text-align:center;font-size:15px;color:var(--soft)}
.err{color:var(--err);font-weight:500;margin:10px 0 0;min-height:1em;text-align:center;font-size:15px}
.done{text-align:center}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done h2{margin:0 0 4px;font-size:24px;font-weight:500}
.done p{margin:0;color:var(--soft)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;min-height:48px;padding:0 22px;font-size:16px;font-weight:500;cursor:pointer;margin-top:18px}
.note{text-align:center;color:var(--soft);font-size:13px;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="paper">
    <p class="kick">{{KICK}}</p>
    <h1>{{TITLE}}</h1>
    <p class="lead">צילמתם רגע יפה? נשמח מאוד שתשתפו אותנו. כל מה שתעלו מגיע ישר אלינו, באיכות מלאה.</p>
    <div class="counter" id="counter" hidden><span>כבר הועלו <b id="cnt">0</b> רגעים 📸</span></div>
  </section>

  <section class="paper" id="closed" hidden>
    <div class="done"><h2>ההעלאה נסגרה</h2><p>תודה רבה לכל מי ששיתף 💛</p></div>
  </section>

  <section class="paper" id="form">

    <label class="pick" id="pick">
      <input type="file" id="file" multiple accept="image/*,video/*">
      <span class="ic" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191917" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg></span>
      <b id="pickT">בחירת תמונות וסרטונים</b>
      <span>אפשר לבחור כמה שרוצים בבת אחת</span>
    </label>

    <div class="files" id="files"></div>
    <div class="sum" id="sum" hidden><span id="sumN"></span><span id="sumS"></span></div>

    <div class="who">
      <label class="f" for="by">השם שלכם <small>(לא חובה)</small></label>
      <input type="text" id="by" maxlength="60" autocomplete="name" placeholder="למשל: משפחת לוי">
    </div>

    <button class="send" id="send" type="button" disabled>העלאה</button>
    <div class="prog" id="prog" hidden><div class="track"><i id="progBar"></i></div><p id="progT"></p></div>
    <p class="err" id="err" role="alert"></p>
    <p class="note">רק אנחנו רואים את מה שמועלה כאן.</p>
  </section>

  <section class="paper" id="done" hidden>
    <div class="done">
      <div class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#191917" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>
      <h2 id="doneT">תודה רבה!</h2>
      <p>שימחתם אותנו. אפשר להוסיף עוד בכל זמן.</p>
      <button class="ghost" id="more" type="button">להעלות עוד</button>
    </div>
  </section>
</div>
<script>
(function(){
  var EV='{{SLUG}}';
  var $=function(id){return document.getElementById(id);};
  var items=[], busy=false;
  function store(k,v){try{if(v===undefined)return localStorage.getItem('ph_'+k);localStorage.setItem('ph_'+k,v);}catch(e){return null;}}
  $('by').value=store('by')||'';

  function fmt(b){if(b<1024*1024)return Math.max(1,Math.round(b/1024))+' KB';if(b<1024*1024*1024)return (b/1048576).toFixed(b<10485760?1:0)+' MB';return (b/1073741824).toFixed(1)+' GB';}
  function isVid(f){return /^video\//.test(f.type)||/\.(mp4|mov|m4v|3gp|webm)$/i.test(f.name);}
  function ok(f){return /^(image|video)\//.test(f.type)||/\.(heic|heif|jpe?g|png|webp|gif|mp4|mov|m4v|3gp|webm)$/i.test(f.name);}

  function info(){
    fetch('/api/photos/info/'+EV).then(function(r){return r.json();}).then(function(j){
      if(j.open===false){$('form').hidden=true;$('closed').hidden=false;}
      if(j.count>0){$('cnt').textContent=j.count;$('counter').hidden=false;}
    }).catch(function(){});
  }
  info();

  function add(list){
    var bad=0;
    Array.prototype.forEach.call(list,function(f){
      if(!ok(f)){bad++;return;}
      if(items.some(function(x){return x.file.name===f.name&&x.file.size===f.size&&x.state!=='done';}))return;
      var it={file:f,state:'wait',sent:0,url:null};
      items.push(it);
    });
    $('err').textContent=bad?'דילגנו על '+bad+' קבצים שאינם תמונה או סרטון':'';
    paint();
  }
  function paint(){
    var box=$('files');box.innerHTML='';
    var waiting=items.filter(function(x){return x.state!=='done';});
    waiting.forEach(function(it){
      var d=document.createElement('div');d.className='tile'+(it.state==='fail'?' fail':'');
      if(!it.url){try{it.url=URL.createObjectURL(it.file);}catch(e){}}
      if(isVid(it.file)){var v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';v.src=it.url+'#t=0.5';d.appendChild(v);
        var tag=document.createElement('span');tag.className='vid';tag.textContent='סרטון';d.appendChild(tag);}
      else{var im=document.createElement('img');im.alt='';im.src=it.url;im.onerror=function(){im.remove();};d.appendChild(im);}
      if(busy){var b=document.createElement('div');b.className='bar';var i=document.createElement('i');i.style.width=Math.round(100*it.sent/it.file.size)+'%';b.appendChild(i);d.appendChild(b);it.bar=i;}
      else{var x=document.createElement('button');x.className='x';x.type='button';x.setAttribute('aria-label','הסרה');x.textContent='×';
        x.onclick=function(e){e.preventDefault();items.splice(items.indexOf(it),1);if(it.url)URL.revokeObjectURL(it.url);paint();};d.appendChild(x);}
      it.el=d;box.appendChild(d);
    });
    var tot=waiting.reduce(function(s,x){return s+x.file.size;},0);
    $('sum').hidden=!waiting.length;
    $('sumN').textContent=waiting.length===1?'קובץ אחד':waiting.length+' קבצים';
    $('sumS').textContent=fmt(tot);
    $('send').disabled=busy||!waiting.length;
    $('send').textContent=waiting.length?'העלאה ('+waiting.length+')':'העלאה';
    $('pickT').textContent=waiting.length?'הוספת עוד':'בחירת תמונות וסרטונים';
  }

  $('file').addEventListener('change',function(){add(this.files);this.value='';});
  var pick=$('pick');
  ['dragenter','dragover'].forEach(function(n){pick.addEventListener(n,function(e){e.preventDefault();pick.classList.add('drag');});});
  ['dragleave','drop'].forEach(function(n){pick.addEventListener(n,function(e){e.preventDefault();pick.classList.remove('drag');});});
  pick.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)add(e.dataTransfer.files);});

  function xhr(method,url,body,onProg){
    return new Promise(function(res,rej){
      var x=new XMLHttpRequest();x.open(method,url);
      if(typeof body==='string')x.setRequestHeader('content-type','application/json');
      if(onProg&&x.upload)x.upload.onprogress=function(e){if(e.lengthComputable)onProg(e.loaded);};
      x.onload=function(){var j={};try{j=JSON.parse(x.responseText);}catch(e){}if(x.status>=200&&x.status<300)res(j);else{var er=new Error(j.error||'שגיאה');er.status=x.status;er.closed=j.closed;rej(er);}};
      x.onerror=function(){rej(new Error('בעיית חיבור'));};
      x.send(body);
    });
  }
  function retry(fn,n){return fn().catch(function(e){if(n<=1||(e.status&&e.status<500&&e.status!==429))throw e;return new Promise(function(r){setTimeout(r,1500*(4-n));}).then(function(){return retry(fn,n-1);});});}

  function thumb(file){
    return new Promise(function(res){
      var done=false,fin=function(b){if(!done){done=true;res(b);}};setTimeout(function(){fin(null);},10000);
      function draw(src,w,h){try{var s=Math.min(1,480/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
        c.getContext('2d').drawImage(src,0,0,c.width,c.height);c.toBlob(function(b){fin(b&&b.size<600000?b:null);},'image/jpeg',0.78);}catch(e){fin(null);}}
      var url=URL.createObjectURL(file);
      if(isVid(file)){var v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
        v.onloadeddata=function(){try{v.currentTime=Math.min(0.5,(v.duration||1)/2);}catch(e){draw(v,v.videoWidth,v.videoHeight);}};
        v.onseeked=function(){draw(v,v.videoWidth,v.videoHeight);URL.revokeObjectURL(url);};v.onerror=function(){fin(null);};v.src=url;}
      else{var im=new Image();im.onload=function(){draw(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(url);};im.onerror=function(){fin(null);};im.src=url;}
    });
  }

  function uploadOne(it,by,note){
    var f=it.file;it.state='up';
    return retry(function(){return xhr('POST','/api/photos/start',JSON.stringify({ev:EV,name:f.name,size:f.size,type:f.type,by:by,note:note}));},3)
    .then(function(s){
      var q='?t='+encodeURIComponent(s.t);
      var main;
      if(!s.multi){
        main=retry(function(){return xhr('PUT','/api/photos/up/'+s.id+q,f,function(l){it.sent=l;prog();});},3);
      }else{
        var size=s.part,n=Math.ceil(f.size/size),parts=[],i=0;
        var next=function(){
          if(i>=n)return xhr('POST','/api/photos/done/'+s.id+q,JSON.stringify({parts:parts}));
          var k=i++,blob=f.slice(k*size,Math.min(f.size,(k+1)*size));
          return retry(function(){return xhr('PUT','/api/photos/part/'+s.id+q+'&n='+(k+1),blob,function(l){it.sent=k*size+l;prog();});},4)
            .then(function(p){parts.push({partNumber:p.partNumber,etag:p.etag});return next();});
        };
        main=next();
      }
      return main.then(function(){
        it.sent=f.size;it.state='done';prog();
        if(it.el)it.el.classList.add('ok');
        return thumb(f).then(function(b){if(b)return xhr('PUT','/api/photos/thumb/'+s.id+q,b).catch(function(){});});
      });
    })
    .catch(function(e){it.state='fail';if(it.el)it.el.classList.add('fail');if(e.closed){$('form').hidden=true;$('closed').hidden=false;}throw e;});
  }

  function prog(){
    var list=items.filter(function(x){return x.batch;});
    var tot=list.reduce(function(s,x){return s+x.file.size;},0)||1,sent=list.reduce(function(s,x){return s+Math.min(x.sent,x.file.size);},0);
    var d=list.filter(function(x){return x.state==='done';}).length;
    $('progBar').style.width=Math.round(100*sent/tot)+'%';
    $('progT').textContent='מעלה '+Math.min(d+1,list.length)+' מתוך '+list.length+' · '+Math.round(100*sent/tot)+'%';
    list.forEach(function(x){if(x.bar)x.bar.style.width=Math.round(100*Math.min(x.sent,x.file.size)/x.file.size)+'%';});
  }

  $('send').addEventListener('click',function(){
    var by=$('by').value.trim(),note='';
    if(by)store('by',by);
    var todo=items.filter(function(x){return x.state==='wait'||x.state==='fail';});
    if(!todo.length)return;
    items.forEach(function(x){x.batch=false;});
    todo.forEach(function(x){x.batch=true;x.state='wait';x.sent=0;});
    busy=true;$('err').textContent='';$('prog').hidden=false;$('pick').hidden=true;paint();prog();
    var q=todo.slice(),failed=0,closed=false;
    function worker(){var it=q.shift();if(!it||closed)return Promise.resolve();return uploadOne(it,by,note).catch(function(e){failed++;if(e.closed)closed=true;}).then(worker);}
    Promise.all([worker(),worker(),worker()]).then(function(){
      busy=false;$('prog').hidden=true;$('pick').hidden=false;
      var n=todo.length-failed;
      if(closed)return;
      if(failed){$('err').textContent=failed===1?'קובץ אחד לא עלה. אפשר ללחוץ שוב על "העלאה" כדי לנסות שוב.':failed+' קבצים לא עלו. אפשר ללחוץ שוב על "העלאה" כדי לנסות שוב.';paint();return;}
      items=items.filter(function(x){return x.state!=='done';});
      $('doneT').textContent=n===1?'תודה רבה! קיבלנו את הקובץ':'תודה רבה! קיבלנו '+n+' קבצים';
      $('form').hidden=true;$('done').hidden=false;paint();info();
    });
  });
  $('more').addEventListener('click',function(){$('done').hidden=true;$('form').hidden=false;$('file').click();});
  window.addEventListener('beforeunload',function(e){if(busy){e.preventDefault();e.returnValue='';}});
})();
</script>
</body>
</html>
