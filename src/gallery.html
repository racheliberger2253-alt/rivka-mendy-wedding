<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>הגלריה שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
:root{--ink:#191917;--soft:#6E6C66;--line:#E7E5DF;--paper:#FFFFFF;--bg:#F5F4F1;--tile:#ECEAE4;--accent:#B9E1F4;--err:#9B2C2C}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,select{font-family:inherit;color:inherit;font-size:15px}
button:focus-visible,select:focus-visible,input:focus{outline:2px solid var(--ink);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:rgba(245,244,241,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{font-size:24px;font-weight:500;margin:0;flex:1 1 auto}
.stat{color:var(--soft);font-size:14px;margin:0}
.tools{max-width:1200px;margin:0 auto;padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:none;background:none;border-radius:999px;min-height:36px;padding:0 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
select{min-height:42px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 14px}
.btn{min-height:42px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 16px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.y{background:var(--accent);border-color:var(--accent)}
.sp{flex:1}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:15px}
.sw input{width:40px;height:24px;appearance:none;-webkit-appearance:none;background:#CFCCC3;border-radius:999px;position:relative;cursor:pointer;transition:background-color .2s;margin:0}
.sw input::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--ink)}.sw input:checked::after{transform:translateX(-16px)}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.it{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--tile);border:none;padding:0;cursor:pointer}
.it img{width:100%;height:100%;object-fit:cover;display:block}
.it .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:13px}
.it .vid{position:absolute;top:8px;left:8px;background:rgba(25,25,23,.65);color:#fff;font-size:12px;border-radius:999px;padding:2px 8px}
.it .by{position:absolute;bottom:0;left:0;right:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--soft);padding:60px 16px}
.card{max-width:420px;margin:60px auto;background:#fff;border-radius:26px;padding:28px 22px;box-shadow:0 10px 30px rgba(25,25,23,.06)}
.card h2{margin:0 0 6px;font-weight:500}
.card input{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.err{color:var(--err);min-height:1em;margin:8px 0 0}
.notes{max-width:1200px;margin:0 auto;padding:0 16px 8px}
.notes details{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.notes summary{cursor:pointer;font-weight:500}
.notes ul{margin:10px 0 0;padding:0 18px}.notes li{margin:6px 0}.notes li b{font-weight:600}
.lb{position:fixed;inset:0;z-index:20;background:rgba(15,15,14,.97);cursor:zoom-out;display:flex;flex-direction:column}
.lb .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;color:#fff}
.lb .hd .t{flex:1;min-width:0;font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .hd button,.lb .hd a{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:999px;min-height:40px;padding:0 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;font-size:14px}
.lb .hd .del{background:rgba(155,44,44,.85)}
.lb .st{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.lb .st img,.lb .st video{max-width:100%;max-height:100%;object-fit:contain}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer}
.lb .nv.p{right:12px}.lb .nv.n{left:12px}
.lb .ft{color:#fff;padding:10px 16px 16px;text-align:center;font-size:15px;min-height:44px}
.it.sel{outline:3px solid var(--ink);outline-offset:-3px}
.it .ck{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(25,25,23,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;line-height:1}
.it.sel .ck{background:var(--ink);border-color:var(--ink)}
.it.sel img{transform:scale(.92);border-radius:10px}
.it img{transition:transform .15s}
.selbar{position:fixed;bottom:0;left:0;right:0;z-index:15;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(25,25,23,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.selbar .in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.selbar b{font-weight:600;flex:1 1 auto}
body.selecting main{padding-bottom:110px}
.btn:disabled{opacity:.4;cursor:default}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;z-index:30;font-size:15px}
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <h2>הגלריה שלנו</h2>
  <p style="color:var(--soft);margin:0">הכניסה עם סיסמת המשפחה, כמו בדף ההתארגנות.</p>
  <input type="password" id="key" autocomplete="current-password" placeholder="סיסמת המשפחה">
  <button class="btn dark" id="go" type="button" style="width:100%;justify-content:center">כניסה</button>
  <p class="err" id="lerr"></p>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="bar">
      <h1 id="ttl">תמונות מהווארט</h1>
      <p class="stat" id="stat"></p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="סינון">
        <button type="button" data-f="all" aria-pressed="true">הכול</button>
        <button type="button" data-f="img" aria-pressed="false">תמונות</button>
        <button type="button" data-f="vid" aria-pressed="false">סרטונים</button>
      </div>
      <select id="who" aria-label="ממי"><option value="">מכולם</option></select>
      <span class="sp"></span>
      <label class="sw"><input type="checkbox" id="open"> <span id="openT">ההעלאה פתוחה</span></label>
      <button class="btn" id="copy" type="button">קישור להעלאה (לאורחים)</button>
      <button class="btn" id="share" type="button">קישור לצפייה (למשפחה)</button>
      <button class="btn" id="unshare" type="button" title="מבטל את קישור הצפייה הנוכחי ויוצר חדש">ביטול קישור הצפייה</button>
      <button class="btn" id="pick" type="button">בחירת תמונות</button>
      <button class="btn y" id="all" type="button">הורדת הכול</button>
    </div>
  </div>
  <div class="notes" id="notesBox" hidden><details><summary id="notesT">ברכות מהאורחים</summary><ul id="notes"></ul></details></div>
  <main><div class="grid" id="grid"></div><p class="empty" id="empty" hidden>עוד לא הועלו תמונות. שלחו את הקישור למשפחה ולחברים 💛</p></main>
</div>

<div class="selbar" id="selbar" hidden>
  <div class="in">
    <b id="selN">לא נבחרו תמונות</b>
    <button class="btn" id="selAll" type="button">בחירת הכול</button>
    <button class="btn" id="selDl" type="button" disabled>הורדה</button>
    <button class="btn dark" id="selSh" type="button" disabled>שיתוף</button>
    <button class="btn" id="selX" type="button">ביטול</button>
  </div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="תצוגה">
  <div class="hd">
    <button type="button" id="lbX" aria-label="סגירה">✕ סגירה</button>
    <span class="t" id="lbT"></span>
    <a id="lbDl" href="#">הורדה</a>
    <button type="button" class="del" id="lbDel">מחיקה</button>
  </div>
  <div class="st" id="lbS">
    <button class="nv p" id="lbP" type="button" aria-label="הקודם">›</button>
    <button class="nv n" id="lbN" type="button" aria-label="הבא">‹</button>
  </div>
  <div class="ft" id="lbF"></div>
</div>

<script>
(function(){
  var EVENTS=/*EVENTS*/{};
  var SHARE=/*SHARE*/null;
  var EV=new URLSearchParams(location.search).get('ev')||'vort';
  if(!EVENTS[EV])EV=Object.keys(EVENTS)[0];
  var $=function(id){return document.getElementById(id);};
  var MOB=!!(navigator.share&&navigator.canShare)&&(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform)));
  var lbFile=null,lbFileId=null;
  var key=null,items=[],view=[],filt='all',who='',cur=-1,picking=false,picked={},shareFiles=null;
  try{key=localStorage.getItem('wed_key');}catch(e){}
  $('ttl').textContent='תמונות מ'+EVENTS[EV].label;

  function api(method,path,body){
    return fetch('/api/photos/'+path,{method:method,headers:{'content-type':'application/json','x-family-key':key||''},body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'שגיאה');e.status=r.status;throw e;}return j;});});
  }
  function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}
  function fmt(b){if(b<1048576)return Math.max(1,Math.round(b/1024))+' KB';if(b<1073741824)return (b/1048576).toFixed(0)+' MB';return (b/1073741824).toFixed(1)+' GB';}
  function isVid(x){return /^video\//.test(x.type)||/\.(mp4|mov|m4v|3gp|webm)$/i.test(x.name);}
  function when(t){return new Date(t).toLocaleString('he-IL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}

  function load(){
    var req=SHARE?fetch('/api/photos/album/'+SHARE).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'שגיאה');e.status=r.status;throw e;}return j;});}):api('GET','list?ev='+EV);
    return req.then(function(j){
      items=j.items;
      if(SHARE){EV=j.ev;$('ttl').textContent='תמונות מ'+EVENTS[EV].label;}
      else{$('open').checked=!!j.open;$('openT').textContent=j.open?'ההעלאה פתוחה':'ההעלאה סגורה';try{localStorage.setItem('wed_key',key);}catch(e){}}
      $('login').hidden=true;$('app').hidden=false;
      var names={};items.forEach(function(x){var n=x.by||'בלי שם';names[n]=(names[n]||0)+1;});
      var sel=$('who'),keep=sel.value;sel.innerHTML='<option value="">מכולם ('+items.length+')</option>';
      Object.keys(names).sort(function(a,b){return names[b]-names[a];}).forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n+' ('+names[n]+')';sel.appendChild(o);});
      sel.value=keep;if(sel.value!==keep)who='';
      var notes=items.filter(function(x){return x.note;}),seen={},nl=$('notes');nl.innerHTML='';
      notes.forEach(function(x){var k=(x.by||'')+'|'+x.note;if(seen[k])return;seen[k]=1;var li=document.createElement('li');var b=document.createElement('b');b.textContent=(x.by||'בלי שם')+': ';li.appendChild(b);li.appendChild(document.createTextNode(x.note));nl.appendChild(li);});
      $('notesBox').hidden=!nl.children.length;$('notesT').textContent='ברכות מהאורחים ('+nl.children.length+')';
      render();
    });
  }
  function render(){
    view=items.filter(function(x){var v=isVid(x);return (filt==='all'||(filt==='vid')===v)&&(!who||(x.by||'בלי שם')===who);});
    var tot=items.reduce(function(s,x){return s+x.size;},0),nv=items.filter(isVid).length;
    $('stat').textContent=(items.length-nv)+' תמונות · '+nv+' סרטונים · '+fmt(tot);
    var g=$('grid');g.innerHTML='';
    view.forEach(function(x,i){
      var b=document.createElement('button');b.type='button';b.className='it';b.setAttribute('aria-label',(isVid(x)?'סרטון':'תמונה')+' מ'+(x.by||'אורח'));
      var ph=document.createElement('span');ph.className='ph';ph.textContent=isVid(x)?'▶':'';b.appendChild(ph);
      var im=document.createElement('img');im.loading='lazy';im.alt='';im.src=x.thumb||(isVid(x)?'':x.url);
      if(!im.src||im.src===location.href)im.remove();else{im.onerror=function(){im.remove();ph.textContent=isVid(x)?'▶':'תמונה';};b.appendChild(im);}
      if(isVid(x)){var t=document.createElement('span');t.className='vid';t.textContent='▶ סרטון';b.appendChild(t);}
      if(x.by){var w=document.createElement('span');w.className='by';w.textContent=x.by;b.appendChild(w);}
      if(picking){var ck=document.createElement('span');ck.className='ck';ck.setAttribute('aria-hidden','true');ck.textContent=picked[x.id]?'✓':'';b.appendChild(ck);if(picked[x.id])b.classList.add('sel');b.setAttribute('aria-pressed',String(!!picked[x.id]));}
      b.onclick=function(){if(picking){if(picked[x.id])delete picked[x.id];else picked[x.id]=1;shareFiles=null;render();}else openLb(i);};g.appendChild(b);
    });
    $('empty').hidden=!!view.length;
    paintSel();
    if(!items.length)$('empty').textContent='עוד לא הועלו תמונות. שלחו את הקישור למשפחה ולחברים 💛';
    else if(!view.length)$('empty').textContent='אין פריטים בסינון הזה';
  }

  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.onclick=function(){filt=b.dataset.f;
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(o){o.setAttribute('aria-pressed',String(o===b));});render();};});
  $('who').onchange=function(){who=this.value;render();};
  $('open').onchange=function(){var on=this.checked;api('POST','open',{ev:EV,open:on}).then(function(){$('openT').textContent=on?'ההעלאה פתוחה':'ההעלאה סגורה';toast(on?'האורחים יכולים להעלות':'ההעלאה נסגרה לאורחים');})
    .catch(function(e){toast(e.message);$('open').checked=!on;});};
  $('copy').onclick=function(){var u=location.origin+'/'+EV;
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('הקישור הועתק: '+u);}).catch(function(){prompt('הקישור לאורחים:',u);});};

  function shareGo(reset){
    api('POST','share',{ev:EV,reset:reset}).then(function(j){var u=location.origin+'/album/'+j.token;
      (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast(reset?'הקישור הישן בוטל. קישור חדש הועתק':'קישור הצפייה הועתק. אפשר להדביק בוואטסאפ');}).catch(function(){prompt('קישור הצפייה למשפחה:',u);});
    }).catch(function(e){toast(e.message);});
  }
  $('share').onclick=function(){shareGo(false);};
  $('unshare').onclick=function(){if(confirm('לבטל את קישור הצפייה? מי שקיבל אותו לא יוכל לצפות יותר. אם תרצי, תוכלי ליצור קישור חדש.'))shareGo(true);};

  /* lightbox */
  function openLb(i){cur=i;$('lb').hidden=false;document.body.style.overflow='hidden';showLb();}
  function closeLb(){$('lb').hidden=true;document.body.style.overflow='';var m=$('lbS').querySelector('img,video');if(m)m.remove();cur=-1;}
  function showLb(){
    var x=view[cur];if(!x){closeLb();return;}
    var s=$('lbS'),old=s.querySelector('img,video');if(old)old.remove();
    var m;if(isVid(x)){m=document.createElement('video');m.controls=true;m.playsInline=true;m.preload='metadata';if(x.thumb)m.poster=x.thumb;}else{m=document.createElement('img');m.alt='';}
    m.src=x.url;s.insertBefore(m,s.firstChild);
    $('lbT').textContent=(cur+1)+' / '+view.length+' · '+x.name+' · '+fmt(x.size);
    $('lbF').textContent=(x.by?x.by+' · ':'')+when(x.at)+(x.note?' · "'+x.note+'"':'');
    $('lbDl').href=x.dl;
    if(MOB){$('lbDl').textContent='שמירה לגלריה';
      if(lbFileId!==x.id){lbFile=null;lbFileId=x.id;
        if(x.size<80*1048576){var want=x.id;fetch(x.url).then(function(r){if(!r.ok)throw new Error();return r.blob();}).then(function(bl){if(lbFileId!==want)return;var f=new File([bl],names([x])[0],{type:bl.type||x.type||'image/jpeg'});if(navigator.canShare({files:[f]}))lbFile=f;}).catch(function(){});}}}
    $('lbP').hidden=cur<=0;$('lbN').hidden=cur>=view.length-1;
  }
  $('lbX').onclick=closeLb;
  // בטלפון: "שמירה לגלריה" פותח את חלון השיתוף, ושם בוחרים "שמירת תמונה" / "שמירה בגלריה"
  $('lbDl').addEventListener('click',function(e){if(!MOB)return;e.preventDefault();
    if(lbFile){navigator.share({files:[lbFile]}).catch(function(err){if(err&&err.name!=='AbortError')toast('לא הצלחנו לפתוח את השמירה. נסו שוב');});}
    else toast('רגע, התמונה עוד נטענת. נסו שוב בעוד שנייה');});
  // לחיצה על הרקע (מחוץ לתמונה ולכפתורים) סוגרת
  $('lb').addEventListener('click',function(e){var x=e.target;if(x===$('lb')||x===$('lbS')||x===$('lbF')||x===$('lbT')||x.classList.contains('hd'))closeLb();});
  $('lbP').onclick=function(){if(cur>0){cur--;showLb();}};
  $('lbN').onclick=function(){if(cur<view.length-1){cur++;showLb();}};
  document.addEventListener('keydown',function(e){if($('lb').hidden)return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')$('lbP').click();if(e.key==='ArrowLeft')$('lbN').click();});
  $('lbDel').onclick=function(){var x=view[cur];if(!x)return;if(!confirm('למחוק את הקובץ הזה לתמיד?'))return;
    api('DELETE','item/'+x.id).then(function(){items=items.filter(function(y){return y.id!==x.id;});render();if(cur>=view.length)cur=view.length-1;if(cur<0)closeLb();else showLb();toast('נמחק');})
    .catch(function(e){toast(e.message);});};

  /* selection */
  function selList(){return items.filter(function(x){return picked[x.id];});}
  function paintSel(){
    document.body.classList.toggle('selecting',picking);$('selbar').hidden=!picking;$('pick').textContent=picking?'סיום בחירה':'בחירת תמונות';
    var ids={};items.forEach(function(x){ids[x.id]=1;});Object.keys(picked).forEach(function(k){if(!ids[k])delete picked[k];});
    var n=selList().length;$('selN').textContent=n?('נבחרו '+n+(n===1?' פריט':' פריטים')):'בוחרים תמונות בלחיצה';
    $('selDl').disabled=!n;$('selSh').disabled=!n||$('selSh').dataset.busy==='1';
    if(!$('selSh').dataset.busy)$('selSh').textContent=shareFiles?(MOB?'שמירה / שיתוף עכשיו':'שיתוף עכשיו'):(MOB?'שיתוף':'שיתוף');
    $('selDl').textContent=MOB?'שמירה לגלריה':'הורדה';
    var allOn=view.length&&view.every(function(x){return picked[x.id];});$('selAll').textContent=allOn?'ניקוי הבחירה':'בחירת הכול';
  }
  $('pick').onclick=function(){picking=!picking;if(!picking){picked={};shareFiles=null;}render();};
  $('selX').onclick=function(){picking=false;picked={};shareFiles=null;render();};
  $('selAll').onclick=function(){var allOn=view.every(function(x){return picked[x.id];});view.forEach(function(x){if(allOn)delete picked[x.id];else picked[x.id]=1;});shareFiles=null;render();};
  $('selDl').onclick=function(){if(MOB){$('selSh').click();return;}downloadList(selList(),$('selDl'),'הורדה');};
  $('selSh').onclick=function(){
    var list=selList(),b=$('selSh');if(!list.length)return;
    if(shareFiles){var data={files:shareFiles};
      navigator.share(data).then(function(){shareFiles=null;paintSel();}).catch(function(e){if(e&&e.name!=='AbortError'){toast('השיתוף לא הצליח. אפשר להוריד ולשתף מהטלפון');}});return;}
    if(!navigator.share||!navigator.canShare){toast('הדפדפן הזה לא תומך בשיתוף קבצים. מורידים במקום.');downloadList(list,$('selDl'),'הורדה');return;}
    var tot=list.reduce(function(s,x){return s+x.size;},0);
    if(tot>300*1048576&&!confirm('הקבצים שנבחרו גדולים ('+fmt(tot)+'). השיתוף עלול להיות איטי. להמשיך?'))return;
    var fn=names(list),done=0;b.dataset.busy='1';b.disabled=true;b.textContent='מכין 0 / '+list.length;
    Promise.all(list.map(function(x,k){return fetch(x.url).then(function(r){if(!r.ok)throw new Error();return r.blob();}).then(function(bl){done++;b.textContent='מכין '+done+' / '+list.length;return new File([bl],fn[k],{type:bl.type||x.type||'application/octet-stream'});});}))
      .then(function(files){delete b.dataset.busy;
        if(!navigator.canShare({files:files})){shareFiles=null;paintSel();toast('אי אפשר לשתף את הקבצים האלה מכאן. מורידים במקום.');downloadList(list,$('selDl'),'הורדה');return;}
        shareFiles=files;paintSel();
        navigator.share({files:files}).then(function(){shareFiles=null;paintSel();}).catch(function(e){if(e&&e.name==='NotAllowedError')toast('הקבצים מוכנים. לוחצים "שיתוף עכשיו"');});})
      .catch(function(){delete b.dataset.busy;shareFiles=null;paintSel();toast('לא הצלחנו להכין את הקבצים. בדקו את החיבור ונסו שוב');});
  };

  /* download */
  function safe(n){return String(n).replace(/[\\\/:*?"<>|\u0000-\u001f]/g,'_').trim().slice(0,120)||'file';}
  function names(list){var used={};return list.map(function(x){var base=safe((x.by?x.by+' - ':'')+x.name),n=base,i=2;
    while(used[n.toLowerCase()]){var m=base.match(/^(.*?)(\.[^.]+)?$/);n=m[1]+' ('+(i++)+')'+(m[2]||'');}used[n.toLowerCase()]=1;return n;});}
  $('all').onclick=function(){downloadList(view.slice(),$('all'),'הורדת הכול');};
  function downloadList(list,btn,label){
    if(!list.length)return;
    var fn=names(list);
    if(window.showDirectoryPicker){
      window.showDirectoryPicker({mode:'readwrite'}).then(function(dir){
        var i=0,fail=0;btn.disabled=true;
        function next(){
          if(i>=list.length){btn.disabled=false;btn.textContent=label;toast(fail?'הסתיים. '+fail+' קבצים לא ירדו':'כל '+list.length+' הקבצים נשמרו בתיקייה');return;}
          var k=i++;btn.textContent='מוריד '+(k+1)+' / '+list.length;
          return dir.getFileHandle(fn[k],{create:true}).then(function(h){return h.createWritable();}).then(function(w){
            return fetch(list[k].url).then(function(r){if(!r.ok)throw new Error();return r.body.pipeTo(w);});
          }).catch(function(){fail++;}).then(next);
        }
        next();
      }).catch(function(){});
    }else{
      if(!confirm('הדפדפן יוריד '+list.length+' קבצים אחד אחרי השני. אם הוא שואל אם לאפשר הורדה של כמה קבצים, אשרו. להמשיך?'))return;
      var i=0;(function step(){if(i>=list.length)return;var a=document.createElement('a');a.href=list[i].dl;a.download=fn[i];document.body.appendChild(a);a.click();a.remove();i++;setTimeout(step,900);})();
    }
  }

  /* login */
  function tryKey(k){key=k;return load().catch(function(e){if(e.status===401){key=null;try{localStorage.removeItem('wed_key');}catch(x){}$('login').hidden=false;$('app').hidden=true;$('lerr').textContent=k?'הסיסמה לא נכונה':'';}else{$('login').hidden=false;$('lerr').textContent=e.message;}});}
  $('go').onclick=function(){tryKey($('key').value.trim());};
  $('key').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click();});
  if(SHARE){
    ['open','copy','share','unshare','lbDel'].forEach(function(id){var el=$(id);(id==='open'?el.parentNode:el).hidden=true;});
    load().catch(function(e){$('app').hidden=true;var c=$('login');c.hidden=false;c.innerHTML='<h2>הקישור לא פעיל</h2><p style="color:var(--soft);margin:0"></p>';c.querySelector('p').textContent=e.message;});
  }
  else if(key)tryKey(key);else $('login').hidden=false;
  setInterval(function(){if((key||SHARE)&&$('lb').hidden&&!$('all').disabled&&!$('selSh').dataset.busy&&!shareFiles)load().catch(function(){});},60000);
})();
</script>
</body>
</html>
